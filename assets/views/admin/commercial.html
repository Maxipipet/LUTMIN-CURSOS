<div class="mt-6 grid xl:grid-cols-[.85fr_1.15fr] gap-5" data-admin-module-v19="commercial">
<form class="bg-white rounded-3xl border border-slate-100 p-5 sm:p-6" id="adminOfferingForm">
<div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-cyan-50 text-cyan-600 flex items-center justify-center"><i class="fa-solid fa-calendar-plus"></i></div><div><h3 class="font-extrabold text-lutmin-dark">Abrir edición de un curso</h3><p class="text-xs text-slate-500">Fecha, modalidad, precio y cupos que aparecerán en la web pública.</p></div></div>
<div class="mt-5 grid sm:grid-cols-2 gap-4">
<div class="sm:col-span-2"><label class="text-xs font-bold text-slate-600">Curso</label><select class="mt-2 w-full px-3 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm" id="adminOfferingCourse" required=""></select></div>
<div><label class="text-xs font-bold text-slate-600">Inicio</label><input class="mt-2 w-full px-3 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm" id="adminOfferingStart" required="" type="date"/></div>
<div><label class="text-xs font-bold text-slate-600">Fin (opcional)</label><input class="mt-2 w-full px-3 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm" id="adminOfferingEnd" type="date"/></div>
<div><label class="text-xs font-bold text-slate-600">Cierre inscripción</label><input class="mt-2 w-full px-3 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm" id="adminOfferingDeadline" type="date"/></div>
<div><label class="text-xs font-bold text-slate-600">Modalidad</label><select class="mt-2 w-full px-3 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm" id="adminOfferingModality"><option value="online">Online</option><option value="presencial">Presencial</option><option value="hibrida">Híbrida</option></select></div>
<div><label class="text-xs font-bold text-slate-600">Precio ARS</label><input class="mt-2 w-full px-3 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm" id="adminOfferingPrice" min="0" step="1" type="number" value="0"/></div>
<div><label class="text-xs font-bold text-slate-600">Cupos</label><input class="mt-2 w-full px-3 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm" id="adminOfferingCapacity" min="1" placeholder="Sin límite" type="number"/></div>
<div class="sm:col-span-2"><label class="text-xs font-bold text-slate-600">Lugar / detalle</label><input class="mt-2 w-full px-3 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm" id="adminOfferingLocation" placeholder="Ej: Campus online / Resistencia / Aula Lutmin"/></div>
<label class="sm:col-span-2 flex items-center gap-2 text-sm font-semibold text-slate-600"><input checked="" class="w-4 h-4" id="adminOfferingPublished" type="checkbox"/> Mostrar esta edición en la web</label>
</div>
<button class="mt-5 w-full py-3 rounded-xl bg-cyan-600 hover:bg-cyan-700 text-white font-extrabold text-sm" type="submit">Publicar edición</button>
</form>
<div class="bg-white rounded-3xl border border-slate-100 overflow-hidden">
<div class="p-5 sm:p-6 border-b border-slate-100"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center"><i class="fa-solid fa-calendar-days"></i></div><div><h3 class="font-extrabold text-lutmin-dark">Ediciones programadas</h3><p class="text-xs text-slate-500">Lo que el público puede elegir al consultar un curso.</p></div></div></div>
<div class="divide-y divide-slate-100" id="adminOfferingsList"></div>
</div>
</div>
<div class="mt-6 bg-white rounded-3xl border border-slate-100 overflow-hidden" data-admin-module-v19="commercial">
<div class="p-5 sm:p-6 border-b border-slate-100">
<div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4"><div><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-violet-50 text-violet-600 flex items-center justify-center"><i class="fa-solid fa-user-clock"></i></div><div><h3 class="font-extrabold text-lutmin-dark">Interesados desde la web</h3><p class="text-xs text-slate-500">Consultas del catálogo. Podés contactarlos o convertirlos en alumnos e inscribirlos.</p></div></div></div></div>
<div class="mt-5 grid md:grid-cols-3 gap-3"><input class="px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm" id="adminLeadSearch" oninput="applyAdminLeadFilters()" placeholder="Buscar nombre, correo o teléfono"/><select class="px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm" id="adminLeadCourseFilter" onchange="applyAdminLeadFilters()"></select><select class="px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm" id="adminLeadStatusFilter" onchange="applyAdminLeadFilters()"><option value="all">Todos los estados</option><option value="new">Nuevos</option><option value="contacted">Contactados</option><option value="payment_pending">Pago pendiente</option><option value="enrolled">Convertidos</option><option value="discarded">Descartados</option></select></div>
</div>
<div class="divide-y divide-slate-100" id="adminLeadsList"></div>
</div>
